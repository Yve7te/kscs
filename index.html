<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名词复数大冒险 · 英语小测试</title>
<style>
  /* ========== 基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ffb6d9;
    --pink-deep: #ff7eb9;
    --purple: #b8a7ff;
    --blue: #9bd6ff;
    --yellow: #ffe08a;
    --mint: #9be8c9;
    --ink: #5a4a6a;
  }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffe8f3 0%, #e6e0ff 45%, #d6f0ff 100%);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* 漂浮背景装饰 */
  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-deco span {
    position: absolute; font-size: 28px; opacity: .55;
    animation: floaty 7s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 24px 18px 40px; }

  /* ========== 通用视图 ========== */
  .view { display: none; animation: pop .35s ease; }
  .view.active { display: block; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: rgba(255,255,255,.92);
    border-radius: 28px;
    box-shadow: 0 12px 30px rgba(180,140,220,.25);
    padding: 30px 26px;
    text-align: center;
  }

  h1 { font-size: 30px; margin-bottom: 12px; color: #d4579f; }
  .subtitle { font-size: 16px; line-height: 1.8; color: #7a6a8a; margin-bottom: 24px; }

  /* 大按钮 */
  .big-btn {
    display: inline-block; border: none; cursor: pointer;
    font-family: inherit; font-size: 22px; font-weight: bold; color: #fff;
    background: linear-gradient(135deg, var(--pink-deep), #c78bff);
    padding: 16px 44px; border-radius: 40px;
    box-shadow: 0 8px 0 #d4579f;
    transition: transform .15s, box-shadow .15s;
  }
  .big-btn:hover { transform: translateY(-3px); }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #d4579f; }

  /* ========== 答题页 ========== */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .pill {
    background: #fff; border-radius: 20px; padding: 8px 16px;
    font-size: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(180,140,220,.2);
  }
  .pill .star { color: #ffb020; }

  .progress { height: 14px; background: #fff; border-radius: 10px; overflow: hidden; margin-bottom: 22px; box-shadow: inset 0 2px 4px rgba(0,0,0,.08); }
  .progress i { display: block; height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, var(--yellow), var(--pink-deep)); transition: width .4s ease; }

  .rule-tag {
    display: inline-block; font-size: 13px; color: #fff; background: var(--purple);
    border-radius: 14px; padding: 5px 14px; margin-bottom: 14px;
  }
  .word-emoji { font-size: 64px; line-height: 1.2; margin-bottom: 6px; }
  .word-singular { font-size: 34px; font-weight: bold; color: #4a3a5a; margin-bottom: 4px; }
  .word-hint { font-size: 15px; color: #9a8aaa; margin-bottom: 22px; }

  .options { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .opt {
    border: 3px solid transparent; cursor: pointer; font-family: inherit;
    background: #fff; border-radius: 20px; padding: 18px 16px;
    font-size: 24px; font-weight: bold; color: var(--ink);
    box-shadow: 0 6px 14px rgba(180,140,220,.18);
    transition: transform .15s, border-color .15s;
  }
  .opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--mint); border-color: #54c99a; color: #1f7a56; }
  .opt.wrong { background: #ffd6d6; border-color: #ff8a8a; color: #b23b3b; }

  .feedback { min-height: 34px; margin-top: 18px; font-size: 18px; font-weight: bold; }
  .feedback.good { color: #2da876; }
  .feedback.bad { color: #d45757; }

  .next-btn {
    margin-top: 14px; border: none; cursor: pointer; font-family: inherit;
    background: var(--yellow); color: #7a5a10; font-size: 18px; font-weight: bold;
    padding: 12px 34px; border-radius: 30px; box-shadow: 0 5px 0 #e6b93f;
  }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #e6b93f; }

  /* ========== 结果页 ========== */
  .royal-stage { display: flex; justify-content: center; align-items: flex-end; gap: 30px; margin: 10px 0 18px; }
  .royal { width: 130px; }
  .royal svg { width: 100%; height: auto; animation: wave 2s ease-in-out infinite; }
  .royal.prince svg { animation-delay: .6s; }
  @keyframes wave {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  .result-title { font-size: 28px; color: #d4579f; margin-bottom: 10px; }
  .score-circle {
    width: 110px; height: 110px; margin: 0 auto 14px; border-radius: 50%;
    background: linear-gradient(135deg, var(--yellow), var(--pink));
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    box-shadow: 0 8px 20px rgba(212,87,159,.3);
  }
  .score-circle .num { font-size: 34px; font-weight: bold; color: #fff; }
  .score-circle .label { font-size: 13px; color: #fff; }
  .result-msg { font-size: 17px; line-height: 1.8; margin-bottom: 24px; color: #7a6a8a; }

  .review-list { text-align: left; background: #faf6ff; border-radius: 18px; padding: 16px 18px; margin-bottom: 24px; font-size: 15px; line-height: 2; }
  .review-list .ok { color: #2da876; }
  .review-list .no { color: #d45757; }

  /* 彩带 */
  .confetti { position: fixed; top: -10px; z-index: 5; pointer-events: none; border-radius: 4px; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

  /* 开始页小图标 */
  .mascot-row { font-size: 46px; margin-bottom: 16px; letter-spacing: 8px; }

  /* 规则小卡片 */
  .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0 26px; text-align: left; }
  .rules div { background: #fff; border-radius: 16px; padding: 12px 14px; font-size: 13.5px; line-height: 1.7; box-shadow: 0 4px 10px rgba(180,140,220,.15); }
  .rules b { color: #d4579f; }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .word-singular { font-size: 28px; }
    .opt { font-size: 20px; }
    .rules { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<div class="wrap">

  <!-- ===== 开始页 ===== -->
  <section class="view active" id="viewStart">
    <div class="card">
      <div class="mascot-row">🐰🎈🦄🎂🐱</div>
      <h1>名词复数大冒险</h1>
      <p class="subtitle">小朋友，你能把下面的单数名词变成<br>正确的复数形式吗？加油哦！</p>
      <div class="rules">
        <div>🌸 <b>一般 +s</b><br>cat → cats</div>
        <div>🍑 <b>s/x/ch/sh +es</b><br>box → boxes</div>
        <div>👶 <b>辅音+y → ies</b><br>baby → babies</div>
        <div>🧸 <b>元音+y 直接 +s</b><br>boy → boys</div>
        <div>🍃 <b>f/fe → ves</b><br>leaf → leaves</div>
        <div>✨ <b>不规则变化</b><br>child → children</div>
      </div>
      <button class="big-btn" onclick="startQuiz()">开始挑战 ✨</button>
    </div>
  </section>

  <!-- ===== 答题页 ===== -->
  <section class="view" id="viewQuiz">
    <div class="top-bar">
      <div class="pill">第 <span id="qIndex">1</span> / <span id="qTotal">10</span> 题</div>
      <div class="pill"><span class="star">⭐</span> 得分：<span id="score">0</span></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="card">
      <span class="rule-tag" id="ruleTag">规则</span>
      <div class="word-emoji" id="qEmoji">🐱</div>
      <div class="word-singular" id="qWord">cat</div>
      <div class="word-hint">选出它的复数形式 👇</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" style="display:none" onclick="nextQuestion()">下一题 ➜</button>
    </div>
  </section>

  <!-- ===== 结果页 ===== -->
  <section class="view" id="viewResult">
    <div class="card">
      <div class="royal-stage">
        <!-- 公主 SVG -->
        <div class="royal princess">
          <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
            <!-- 皇冠 -->
            <path d="M35 30 L42 12 L55 26 L60 8 L65 26 L78 12 L85 30 Z" fill="#ffd23f" stroke="#e6a900" stroke-width="2"/>
            <circle cx="60" cy="22" r="3" fill="#ff7eb9"/>
            <!-- 头发 -->
            <path d="M32 42 Q30 78 40 88 L80 88 Q90 78 88 42 Q88 30 60 30 Q32 30 32 42Z" fill="#8a5a3a"/>
            <!-- 脸 -->
            <circle cx="60" cy="52" r="24" fill="#ffe0c7"/>
            <circle cx="51" cy="52" r="3" fill="#5a3a2a"/>
            <circle cx="69" cy="52" r="3" fill="#5a3a2a"/>
            <circle cx="51" cy="52" r="1.3" fill="#fff"/>
            <circle cx="69" cy="52" r="1.3" fill="#fff"/>
            <path d="M53 63 Q60 68 67 63" stroke="#d4708a" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="46" cy="59" r="3" fill="#ffb6c9" opacity=".7"/>
            <circle cx="74" cy="59" r="3" fill="#ffb6c9" opacity=".7"/>
            <!-- 裙子 -->
            <path d="M40 82 L80 82 L96 140 L24 140 Z" fill="#ff9ecf" stroke="#e86aa8" stroke-width="2"/>
            <path d="M40 82 L80 82 L86 100 L34 100 Z" fill="#ff7eb9"/>
            <circle cx="60" cy="118" r="5" fill="#fff" opacity=".8"/>
            <!-- 手臂 -->
            <path d="M40 88 Q26 96 22 108" stroke="#ffe0c7" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="M80 88 Q94 96 98 108" stroke="#ffe0c7" stroke-width="7" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <!-- 王子 SVG -->
        <div class="royal prince">
          <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
            <!-- 王冠 -->
            <path d="M38 28 L44 12 L56 24 L60 10 L64 24 L76 12 L82 28 Z" fill="#ffd23f" stroke="#e6a900" stroke-width="2"/>
            <!-- 头发 -->
            <path d="M34 38 Q34 28 60 28 Q86 28 86 38 L86 46 L34 46Z" fill="#5a3a2a"/>
            <!-- 脸 -->
            <circle cx="60" cy="54" r="24" fill="#ffe0c7"/>
            <circle cx="51" cy="54" r="3" fill="#3a2a1a"/>
            <circle cx="69" cy="54" r="3" fill="#3a2a1a"/>
            <circle cx="51" cy="54" r="1.3" fill="#fff"/>
            <circle cx="69" cy="54" r="1.3" fill="#fff"/>
            <path d="M54 65 Q60 68 66 65" stroke="#8a5a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- 身体 / 披风 -->
            <path d="M38 84 L82 84 L94 140 L26 140 Z" fill="#7aa8ff" stroke="#4a7fd4" stroke-width="2"/>
            <path d="M38 84 L82 84 L88 104 L32 104 Z" fill="#4a7fd4"/>
            <!-- 披风 -->
            <path d="M34 86 Q20 110 24 138 L44 138 Z" fill="#ff6b7a" opacity=".85"/>
            <path d="M86 86 Q100 110 96 138 L76 138 Z" fill="#ff6b7a" opacity=".85"/>
            <!-- 手臂 -->
            <path d="M40 90 Q26 98 22 110" stroke="#ffe0c7" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="M80 90 Q94 98 98 110" stroke="#ffe0c7" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- 纽扣 -->
            <circle cx="60" cy="112" r="3" fill="#ffd23f"/>
            <circle cx="60" cy="124" r="3" fill="#ffd23f"/>
          </svg>
        </div>
      </div>

      <div class="result-title" id="resultTitle">🎉 恭喜通关！</div>
      <div class="score-circle">
        <span class="num" id="finalScore">0</span>
        <span class="label">答对 / 共 <span id="finalTotal">10</span> 题</span>
      </div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="review-list" id="reviewList"></div>
      <button class="big-btn" onclick="restart()">再玩一次 🔄</button>
    </div>
  </section>

</div>

<script>
/* ========== 题库 ==========
   rule: 规则标签；word: 单数；emoji; answer: 正确复数；bad: 干扰项 */
const QUESTION_BANK = [
  { rule: "一般 +s",        word: "cat",      emoji: "🐱", answer: "cats",      bad: ["cates", "cat's"] },
  { rule: "一般 +s",        word: "book",     emoji: "📚", answer: "books",     bad: ["bookes", "bookies"] },
  { rule: "一般 +s",        word: "apple",    emoji: "🍎", answer: "apples",    bad: ["applees", "appless"] },
  { rule: "一般 +s",        word: "pen",      emoji: "✏️", answer: "pens",      bad: ["penes", "penies"] },
  { rule: "s/x/ch/sh +es",  word: "bus",      emoji: "🚌", answer: "buses",    bad: ["buss", "bus's"] },
  { rule: "s/x/ch/sh +es",  word: "box",      emoji: "📦", answer: "boxes",    bad: ["boxs", "boxies"] },
  { rule: "s/x/ch/sh +es",  word: "watch",    emoji: "⌚", answer: "watches",  bad: ["watchs", "watchies"] },
  { rule: "s/x/ch/sh +es",  word: "peach",    emoji: "🍑", answer: "peaches",  bad: ["peachs", "peachies"] },
  { rule: "辅音+y → ies",   word: "baby",     emoji: "👶", answer: "babies",   bad: ["babys", "babees"] },
  { rule: "辅音+y → ies",   word: "story",    emoji: "📖", answer: "stories",  bad: ["storys", "storyes"] },
  { rule: "辅音+y → ies",   word: "family",   emoji: "👨‍👩‍👧", answer: "families", bad: ["familys", "familyes"] },
  { rule: "元音+y +s",      word: "boy",      emoji: "👦", answer: "boys",     bad: ["boies", "boyes"] },
  { rule: "元音+y +s",      word: "toy",      emoji: "🧸", answer: "toys",     bad: ["toies", "toyes"] },
  { rule: "元音+y +s",      word: "monkey",   emoji: "🐒", answer: "monkeys",  bad: ["monkies", "monkeyes"] },
  { rule: "f/fe → ves",     word: "knife",    emoji: "🔪", answer: "knives",   bad: ["knifes", "knifes'"] },
  { rule: "f/fe → ves",     word: "leaf",     emoji: "🍃", answer: "leaves",   bad: ["leafs", "leafes"] },
  { rule: "不规则变化",       word: "man",      emoji: "👨", answer: "men",      bad: ["mans", "mens"] },
  { rule: "不规则变化",       word: "child",    emoji: "🧒", answer: "children", bad: ["childs", "childes"] },
  { rule: "不规则变化",       word: "foot",     emoji: "🦶", answer: "feet",     bad: ["foots", "footes"] },
  { rule: "不规则变化",       word: "mouse",    emoji: "🐭", answer: "mice",     bad: ["mouses", "mices"] },
  { rule: "不规则变化",       word: "sheep",    emoji: "🐑", answer: "sheep",    bad: ["sheeps", "sheepes"] },
  { rule: "不规则变化",       word: "fish",     emoji: "🐟", answer: "fish",     bad: ["fishs", "fishes"] }
];

const TOTAL = 10;
let quiz = [];          // 当前本轮题目
let current = 0;        // 当前题号
let score = 0;
let answered = false;
let results = [];       // {word, emoji, answer, chosen, ok}

/* ========== 工具 ========== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ========== 开始 / 答题 ========== */
function startQuiz() {
  quiz = shuffle(QUESTION_BANK).slice(0, TOTAL);
  current = 0; score = 0; results = [];
  document.getElementById("qTotal").textContent = quiz.length;
  document.getElementById("score").textContent = score;
  showView("viewQuiz");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = quiz[current];
  document.getElementById("qIndex").textContent = current + 1;
  document.getElementById("score").textContent = score;
  document.getElementById("ruleTag").textContent = "📌 " + q.rule;
  document.getElementById("qEmoji").textContent = q.emoji;
  document.getElementById("qWord").textContent = q.word;
  document.getElementById("bar").style.width = (current / quiz.length * 100) + "%";

  const feedback = document.getElementById("feedback");
  feedback.textContent = ""; feedback.className = "feedback";
  document.getElementById("nextBtn").style.display = "none";

  // 选项打乱：正确答案 + 两个干扰项
  const opts = shuffle([q.answer, ...q.bad]);
  const box = document.getElementById("options");
  box.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt;
    btn.onclick = () => choose(btn, opt, q);
    box.appendChild(btn);
  });
}

function choose(btn, opt, q) {
  if (answered) return;
  answered = true;
  const isOk = opt === q.answer;
  const allBtns = document.querySelectorAll(".opt");
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add("correct");
  });

  const feedback = document.getElementById("feedback");
  if (isOk) {
    score++;
    document.getElementById("score").textContent = score;
    btn.classList.add("correct");
    feedback.textContent = pick(["太棒了！🌟", "答对啦！🎉", "真聪明！💖", "哇，好厉害！✨"]);
    feedback.className = "feedback good";
    results.push({ word: q.word, emoji: q.emoji, answer: q.answer, chosen: opt, ok: true });
  } else {
    btn.classList.add("wrong");
    feedback.textContent = "再记一下哦：" + q.word + " → " + q.answer + " 🌱";
    feedback.className = "feedback bad";
    results.push({ word: q.word, emoji: q.emoji, answer: q.answer, chosen: opt, ok: false });
  }
  document.getElementById("nextBtn").style.display = "inline-block";
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function nextQuestion() {
  current++;
  if (current < quiz.length) {
    renderQuestion();
  } else {
    finishQuiz();
  }
}

/* ========== 结果 ========== */
function finishQuiz() {
  document.getElementById("bar").style.width = "100%";
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalTotal").textContent = quiz.length;

  const ratio = score / quiz.length;
  let title, msg;
  if (ratio === 1) {
    title = "👸🤴 公主与王子为你喝彩！";
    msg = "全部答对啦！你就是今天的「语法小达人」，公主和王子都来为你鼓掌～";
  } else if (ratio >= 0.7) {
    title = "🎉 太棒啦，差一点点满分！";
    msg = "公主和王子说：你学得真不错！再复习一下下面的错题，下次一定能全部答对。";
  } else if (ratio >= 0.4) {
    title = "💪 继续加油哦！";
    msg = "公主和王子为你加油打气！把下面的错题多读几遍，你会越来越棒的。";
  } else {
    title = "🌱 别灰心，慢慢来！";
    msg = "公主和王子陪你一起练习！多看小规则、多读名词，下次一定会有进步。";
  }
  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultMsg").textContent = msg;

  // 错题 / 全对回顾
  const list = document.getElementById("reviewList");
  const wrong = results.filter(r => !r.ok);
  if (wrong.length === 0) {
    list.innerHTML = "✅ 所有名词都变对啦，没有错题！";
  } else {
    list.innerHTML = "<b>本次小回顾：</b><br>" + wrong.map(r =>
      `<span class="no">✗</span> ${r.emoji} ${r.word} → <b class="ok">${r.answer}</b>　（你选了 ${r.chosen}）`
    ).join("<br>");
  }

  showView("viewResult");
  launchConfetti();
}

function restart() {
  startQuiz();
}

/* ========== 彩带 ========== */
function launchConfetti() {
  const colors = ["#ff7eb9", "#b8a7ff", "#9bd6ff", "#ffe08a", "#9be8c9", "#ff9aa2"];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    const size = 6 + Math.random() * 8;
    c.style.width = size + "px";
    c.style.height = size * (Math.random() > .5 ? 1 : 0.5) + "px";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animation = `fall ${2.5 + Math.random() * 2}s linear ${Math.random() * 1.2}s forwards`;
    c.style.opacity = .9;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

/* ========== 背景装饰 ========== */
(function deco() {
  const symbols = ["⭐", "☁️", "🌸", "🎈", "✨", "🧸"];
  const box = document.getElementById("bgDeco");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span");
    s.textContent = symbols[i % symbols.length];
    s.style.left = Math.random() * 92 + "vw";
    s.style.top = Math.random() * 90 + "vh";
    s.style.fontSize = 18 + Math.random() * 22 + "px";
    s.style.animationDelay = (Math.random() * 5) + "s";
    box.appendChild(s);
  }
})();
</script>
