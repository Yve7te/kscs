<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语小测试 · a / an / the</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Noto Sans SC", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #cfe9ff 0%, #e8f4ff 45%, #ffeef6 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; overflow-x: hidden;
  }
  .card {
    width: 100%; max-width: 560px; background: #fff;
    border-radius: 28px; box-shadow: 0 18px 45px rgba(120, 160, 220, .25);
    padding: 32px 28px; text-align: center; position: relative;
  }
  h1 { color: #ff7eb3; font-size: 30px; margin-bottom: 8px; }
  .subtitle { color: #6b8bbf; font-size: 16px; margin-bottom: 22px; }

  /* 进度 */
  .progress-bar { height: 14px; background: #eef3fb; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb3d1, #7ec8ff); border-radius: 10px; transition: width .4s; }
  .q-count { color: #8aa6cf; font-size: 15px; margin-bottom: 10px; }

  .sentence {
    font-size: 26px; color: #33476b; line-height: 1.7; margin: 18px 0 28px;
    background: #f6faff; border-radius: 18px; padding: 22px 16px;
  }
  .blank { display: inline-block; min-width: 70px; border-bottom: 3px dashed #ff9ec6; color: #ff7eb3; font-weight: bold; }

  .options { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .opt {
    min-width: 110px; padding: 18px 26px; font-size: 26px; font-weight: bold;
    border: 3px solid #b9d8f5; background: #f2f9ff; color: #33476b;
    border-radius: 20px; cursor: pointer; transition: transform .15s, background .15s;
    font-family: inherit;
  }
  .opt:hover { transform: translateY(-4px); background: #e3f2ff; }
  .opt:disabled { cursor: default; }
  .opt.correct { background: #d7f7e3; border-color: #5fce8b; color: #219150; }
  .opt.wrong { background: #ffe0e0; border-color: #ff8f8f; color: #d94343; }

  .feedback { margin-top: 20px; font-size: 20px; min-height: 30px; font-weight: bold; }
  .feedback.good { color: #219150; }
  .feedback.bad { color: #d94343; }

  .btn {
    margin-top: 24px; padding: 16px 40px; font-size: 22px; font-weight: bold;
    color: #fff; background: linear-gradient(135deg, #ff9ec6, #7ec8ff);
    border: none; border-radius: 30px; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 18px rgba(150, 170, 230, .35); transition: transform .15s;
  }
  .btn:hover { transform: translateY(-3px); }

  /* 开始页 */
  .start-emoji { font-size: 64px; margin-bottom: 10px; }
  .rule { color: #6b8bbf; font-size: 16px; line-height: 1.8; margin: 14px 0 26px; }

  /* 结果页 */
  .result-img { width: 100%; border-radius: 20px; margin: 18px 0; box-shadow: 0 10px 25px rgba(150,170,230,.25); }
  .score { font-size: 28px; color: #ff7eb3; font-weight: bold; margin: 10px 0; }
  .congrats { font-size: 22px; color: #33476b; line-height: 1.7; }

  /* 漂浮装饰 */
  .float { position: fixed; font-size: 34px; pointer-events: none; animation: floatUp linear infinite; opacity: .8; }
  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-10vh) rotate(360deg); }
  }
  .hidden { display: none; }
</style>
</head>

  <!-- 漂浮星星装饰 -->
  <div class="float" style="left:6%;  animation-duration:9s;">⭐</div>

<script>
// ===== 题库：一年级 a/an/the =====
const QUESTIONS = [
  { text: "This is ______ apple.",             answer: "an"  }, // apple 元音开头
  { text: "I have ______ cute cat.",           answer: "a"   }, // cute 辅音 /k/
  { text: "______ sun is bright today.",       answer: "The" }, // 特指
  { text: "She is ______ English teacher.",     answer: "an"  }, // English 元音 /ɪ/
  { text: "He has ______ egg.",                answer: "an"  }, // egg 元音开头
  { text: "______ dog is running fast.",       answer: "The" }, // 特指
  { text: "This is ______ sweet orange.",      answer: "a"   }, // sweet 辅音 /s/，名词 orange 虽元音开头仍用 a
  { text: "I see ______ little bird.",          answer: "a"   }, // little 辅音 /l/
  { text: "______ book on the desk is mine.",  answer: "The" }, // 特指
  { text: "It is ______ big elephant.",        answer: "a"   }  // big 辅音 /b/，名词 elephant 虽元音开头仍用 a
];
const OPTIONS = ["a", "an", "The"];

let current = 0;
let score = 0;
let audioCtx = null;

// ===== 音效（Web Audio 生成，无需外部文件）=====
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, start, dur, type = "sine", vol = 0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + start);
  osc.stop(audioCtx.currentTime + start + dur + 0.05);
}
function playCorrect() {  // 上行叮咚
  tone(523.25, 0,    0.18, "sine");
  tone(659.25, 0.12, 0.18, "sine");
  tone(783.99, 0.24, 0.28, "sine");
}
function playWrong() {   // 低沉提示
  tone(220, 0,    0.2, "triangle", 0.2);
  tone(160, 0.15, 0.3, "triangle", 0.2);
}
function playWin() {      // 胜利小旋律
  const notes = [523.25, 587.33, 659.25, 783.99, 1046.5];
  notes.forEach((f, i) => tone(f, i * 0.16, 0.25, "sine", 0.25));
  tone(1318.5, notes.length * 0.16, 0.4, "sine", 0.25);
}

// ===== 页面切换 =====
const $ = id => document.getElementById(id);
function show(id) {
  ["startPage", "quizPage", "resultPage"].forEach(p => $(p).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

function startQuiz() {
  ensureAudio();
  current = 0; score = 0;
  show("quizPage");
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $("qCount").textContent = `第 ${current + 1} 题 / 共 ${QUESTIONS.length} 题`;
  $("progressFill").style.width = (current / QUESTIONS.length * 100) + "%";
  $("sentence").innerHTML = q.text.replace("______", '<span class="blank">?</span>');
  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  const box = $("options");
  box.innerHTML = "";
  OPTIONS.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.onclick = () => choose(b, opt, q.answer);
    box.appendChild(b);
  });
}

function choose(btn, opt, answer) {
  const buttons = [...document.querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);

  const fb = $("feedback");
  if (opt.toLowerCase() === answer.toLowerCase()) {
    score++;
    btn.classList.add("correct");
    fb.textContent = "🎉 答对啦，真棒！";
    fb.classList.add("good");
    playCorrect();
  } else {
    btn.classList.add("wrong");
    // 标出正确答案
    buttons.forEach(b => {
      if (b.textContent.toLowerCase() === answer.toLowerCase()) b.classList.add("correct");
    });
    fb.textContent = "💪 再想想，正确答案是 " + answer;
    fb.classList.add("bad");
    playWrong();
  }

  setTimeout(() => {
    current++;
    if (current < QUESTIONS.length) renderQuestion();
    else finish();
  }, 1300);
}

function finish() {
  show("resultPage");
  $("progressFill").style.width = "100%";
  $("scoreText").textContent = `得分：${score} / ${QUESTIONS.length}`;
  let msg;
  if (score === QUESTIONS.length)      msg = "太厉害啦，你是语法小天才！🌟";
  else if (score >= 7)                 msg = "很不错哦，继续加油！💖";
  else                                 msg = "别灰心，再练习一次会更棒！🌷";
  $("congratsText").textContent = msg;
  playWin();
  confetti();
}

// 简单彩带飘落
function confetti() {
  const colors = ["#ff9ec6", "#7ec8ff", "#ffd76e", "#9be7b8", "#c9a7ff"];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement("div");
    c.style.position = "fixed";
    c.style.top = "-20px";
    c.style.left = Math.random() * 100 + "vw";
    c.style.width = "12px"; c.style.height = "12px";
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
    c.style.zIndex = 99;
    c.style.pointerEvents = "none";
    document.body.appendChild(c);
    const fall = c.animate(
      [{ transform: "translateY(0) rotate(0deg)", opacity: 1 },
       { transform: `translateY(105vh) rotate(${360 + Math.random()*360}deg)`, opacity: .6 }],
      { duration: 2500 + Math.random() * 2000, easing: "ease-in" }
    );
    fall.onfinish = () => c.remove();
  }
}

function restart() { startQuiz(); }
</script>
