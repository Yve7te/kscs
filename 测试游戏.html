<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be动词魔法闯关 一年级英语小测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        candy: {
                            pink: '#FFB6C1',
                            blue: '#87CEFA',
                            yellow: '#FFE799',
                            green: '#98FB98',
                            purple: '#DDA0DD',
                            orange: '#FFC896'
                        }
                    },
                    fontFamily: {
                        kid: ['"Comic Sans MS"', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        bounceSlow: 'bounce 2s infinite',
                        shake: 'shake 0.4s ease-in-out',
                        pop: 'pop 0.4s ease-out forwards',
                        float: 'float 2.5s ease-in-out infinite'
                    },
                    keyframes: {
                        shake: {
                            '0%,100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-6px)' },
                            '75%': { transform: 'translateX(6px)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.7)', opacity: 0 },
                            '100%': { transform: 'scale(1)', opacity: 1 }
                        },
                        float: {
                            '0%,100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .cloud-shadow {
                box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            }
            .btn-kid {
                @apply rounded-3xl px-5 py-3 text-lg font-bold transition-all duration-200 hover:scale-105 active:scale-95 cloud-shadow;
            }
            .card-cute {
                @apply rounded-[2rem] p-5 cloud-shadow;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-candy-blue via-candy-pink to-candy-yellow min-h-screen font-kid overflow-x-hidden">
    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- 首页 -->
        <div id="pageStart" class="text-center">
            <div class="card-cute bg-white/90 mb-6">
                <h1 class="text-[clamp(1.8rem,6vw,2.4rem)] text-candy-purple font-bold mb-3">Be动词魔法闯关</h1>
                <p class="text-gray-600 text-lg mb-2">一年级英语 · am / is / are 缩写大挑战</p>
                <div class="text-5xl my-4 animate-bounceSlow">🧙‍♀️🪄</div>
                <p class="text-gray-500 mb-6">口诀：我用am，你用are，is连着他她它</p>
                <button onclick="startGame()" class="btn-kid bg-candy-green text-gray-800">
                    开始闯关！
                </button>
            </div>
            <div class="text-sm text-gray-600 bg-white/70 rounded-2xl p-4">
                小提示：I am not 只能缩写成 I’m not，没有 amn’t！
            </div>
        </div>

        <!-- 答题页面 -->
        <div id="pageQuiz" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="bg-white/90 rounded-full px-4 py-2 font-bold">得分：<span id="score">0</span></div>
                <div class="bg-white/90 rounded-full px-4 py-2 font-bold">第 <span id="qIndex">1</span> / <span id="totalQ">10</span> 题</div>
            </div>
            <div class="card-cute bg-white/95 mb-5">
                <div class="text-4xl mb-3 text-center" id="qEmoji">🪄</div>
                <h2 class="text-xl md:text-2xl font-bold text-center text-gray-800 mb-4" id="questionText"></h2>
                <div id="answerBox" class="grid gap-3">
                </div>
                <div id="tipText" class="mt-4 text-center text-lg font-bold hidden"></div>
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="nextQuestion()" id="btnNext" class="btn-kid bg-candy-blue text-white hidden">
                    下一题
                </button>
            </div>
        </div>

        <!-- 结束页 -->
        <div id="pageEnd" class="hidden text-center">
            <div class="card-cute bg-white/95">
                <div class="flex justify-center gap-6 text-6xl mb-4">
                    <span class="animate-float">👸</span>
                    <span class="animate-float" style="animation-delay:0.3s">🤴</span>
                </div>
                <h2 class="text-2xl font-bold text-candy-purple mb-3">闯关完成！</h2>
                <p class="text-xl mb-2">你的总分：<span id="finalScore" class="font-bold text-2xl">0</span> / 10</p>
                <p id="resultComment" class="text-gray-700 my-4 text-lg"></p>
                <button onclick="restartGame()" class="btn-kid bg-candy-orange text-gray-800 mt-2">再来一次</button>
            </div>
        </div>
    </div>

    <script>
        // 内置音效生成器，不用外部音频文件
        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playCorrect() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime+0.12);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        }
        function playWrong() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(190, audioCtx.currentTime+0.15);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }
        function playWin() {
            initAudio();
            const notes = [523,659,784,1047];
            notes.forEach((f, i)=>{
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = f;
                const t = audioCtx.currentTime + i*0.18;
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t+0.3);
                osc.start(t); osc.stop(t+0.3);
            })
        }

        const questionList = [
            {
                q: "I am 的缩写是？",
                emoji: "👧",
                options: ["I’m", "I am", "I’m not"],
                ans: "I’m"
            },
            {
                q: "You are 的缩写是？",
                emoji: "👦",
                options: ["You’re", "You is", "You am"],
                ans: "You’re"
            },
            {
                q: "He is 的缩写是？",
                emoji: "👨",
                options: ["He’s", "He am", "He’re"],
                ans: "He’s"
            },
            {
                q: "She is 的缩写是？",
                emoji: "👩",
                options: ["She’s", "She am", "She’re"],
                ans: "She’s"
            },
            {
                q: "It is 的缩写是？",
                emoji: "🐱",
                options: ["It’s", "It am", "It’re"],
                ans: "It’s"
            },
            {
                q: "I am not 的缩写是？",
                emoji: "🙅‍♀️",
                options: ["I’m not", "I amn’t", "I not"],
                ans: "I’m not"
            },
            {
                q: "You are not 的缩写是？",
                emoji: "🙅‍♂️",
                options: ["You aren’t", "You’re not", "You amn’t"],
                ans: "You aren’t"
            },
            {
                q: "He is not 的缩写是？",
                emoji: "🙅",
                options: ["He isn’t", "He’s not", "He amn’t"],
                ans: "He isn’t"
            },
            {
                q: "She is not 的缩写是？",
                emoji: "🙅‍♀️",
                options: ["She isn’t", "She’s not", "She amn’t"],
                ans: "She isn’t"
            },
            {
                q: "It is not 的缩写是？",
                emoji: "🙅‍🐶",
                options: ["It isn’t", "It’s not", "It amn’t"],
                ans: "It isn’t"
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        function startGame() {
            $("#pageStart").classList.add("hidden");
            $("#pageQuiz").classList.remove("hidden");
            $("#pageEnd").classList.add("hidden");
            currentIndex = 0;
            score = 0;
            $("#score").innerText = score;
            $("#totalQ").innerText = questionList.length;
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            $("#btnNext").classList.add("hidden");
            $("#tipText").classList.add("hidden");
            const q = questionList[currentIndex];
            $("#qIndex").innerText = currentIndex + 1;
            $("#questionText").innerText = q.q;
            $("#qEmoji").innerText = q.emoji;
            const box = $("#answerBox");
            box.innerHTML = "";
            const shuffled = [...q.options].sort(() => Math.random() - 0.5);
            shuffled.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn-kid bg-white border-2 border-gray-200 text-gray-800 w-full text-left pl-6";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, q.ans);
                box.appendChild(btn);
            })
        }

        function selectAnswer(selected, correct) {
            if (answered) return;
            answered = true;
            const allBtns = $$("#answerBox button");
            allBtns.forEach(b => b.disabled = true);
            const tip = $("#tipText");
            if (selected === correct) {
                playCorrect();
                score += 1;
                $("#score").innerText = score;
                tip.innerText = "太棒啦！答对咯！";
                tip.className = "mt-4 text-center text-lg font-bold text-green-600";
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add("bg-candy-green");
                })
            } else {
                playWrong();
                tip.innerText = "不对哦，正确答案：" + correct;
                tip.className = "mt-4 text-center text-lg font-bold text-rose-500";
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add("bg-candy-green");
                    if (b.innerText === selected) b.classList.add("bg-rose-200", "animate-shake");
                })
            }
            tip.classList.remove("hidden");
            $("#btnNext").classList.remove("hidden");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= questionList.length) {
                showResult();
                return;
            }
            renderQuestion();
        }

        function showResult() {
            playWin();
            $("#pageQuiz").classList.add("hidden");
            $("#pageEnd").classList.remove("hidden");
            $("#finalScore").innerText = score;
            let comment = "";
            if (score >= 9) comment = "👸公主和🤴王子来恭喜你！超级小魔法师！be动词掌握得超好！";
            else if (score >=7) comment = "👸公主和🤴王子夸你很棒！再多练习一点点就满分啦！";
            else if (score >=5) comment = "👸公主和🤴王子说你不错哦，我们再复习一下缩写！";
            else comment = "👸公主和🤴王子说没关系，我们再来闯关，多练就会啦！";
            $("#resultComment").innerText = comment;
        }

        function restartGame() {
            startGame();
        }
    </script>
</body>
</html>
